apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.app.name }}-configs

data:
  AWS_REGION: {{ .Values.aws.region | quote }}
  SQS_QUEUE_NAMES_{{ .Values.queue.event }}: "{{ .Values.app.project }}-{{ .Values.app.env }}-{{ .Values.queue.name }}"
  {{- range $key, $value := .Values.queueNames }}
  SQS_QUEUE_NAMES_{{ $key }}: "{{ $.Values.app.project }}-{{ $.Values.app.env }}-{{ $value }}"
  {{- end }}
  S3_BUCKET_PREFIX: "{{ .Values.app.project }}-{{ .Values.app.env }}-{{ .Values.bucket.prefix }}"
  FRAME_PREFIX: {{ .Values.bucket.framePrefix | quote }}
  PROCESSING_JOBS_TABLE_NAME: "{{ .Values.app.project }}-{{ .Values.app.env }}-videos-db"
  {{- $envMap := dict "dev" "development" "stg" "staging" "prod" "production" }}
  APP_ENV: {{ index $envMap .Values.app.env | default "development" | quote }}
  APP_NAME: {{ .Values.app.name | quote }}
  APP_VERSION: {{ .Values.app.version | quote }}
  DD_OTLP_ENDPOINT: {{ .Values.datadog.otlpEndpoint | quote }}
  MAX_VIDEO_DURATION_SECONDS: {{ .Values.limits.maxVideoDurationSeconds | int64 | quote }}
  MAX_FILE_SIZE_BYTES: {{ .Values.limits.maxFileSizeBytes | int64 | quote }}
