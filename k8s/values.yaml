app:
  project: fiapx
  name: processor
  version: 1.0.0
  env: dev

image:
  repository: ""
  tag: latest

aws:
  region: us-east-1

queue:
  event: VIDEO_PROCESSING_REQUESTED
  name: "video-processing-requested"
  url: ""

queueNames:
  VIDEO_PROCESSING_COMPLETED: "video-processing-completed"

bucket:
  prefix: "artifacts"
  framePrefix: "frames"

datadog:
  otlpEndpoint: "https://otlp.us5.datadoghq.com"

job:
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: "250m"
      memory: "384Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

limits:
  maxVideoDurationSeconds: 600
  # 314572800 bytes = 300 MiB (binário, não decimal)
  maxFileSizeBytes: 314572800
  maxParallelJobs: 3

secrets:
  clusterSecretStore: fiapx-aws-secrets
